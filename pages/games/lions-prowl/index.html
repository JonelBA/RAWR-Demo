<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../../">
  <title>Lion's Prowl - RAWR Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/pages/multipage.css">
  <link rel="stylesheet" href="css/games/games.css">
  <link rel="stylesheet" href="css/php-pages/game-standalone.css">
  <link rel="stylesheet" href="css/php-pages/games/lions-prowl.css">
  <link rel="stylesheet" href="css/php-pages/games/demo-interactions.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="demo-data/data.js" defer></script>
  <script src="js/pages/demo-state.js" defer></script>
  <script src="js/pages/site-shell.js" defer></script>
  <script src="js/pages/games.js" defer></script>
</head>
<body data-page="game-prowl" data-game="prowl">
  <div id="app-header"></div>
  <div class="app-layout">
    <aside id="app-sidebar"></aside>
    <main class="page-main standalone-game">
      <div class="game-grid">
        <section class="game-main-content">
          <header class="game-title-section">
            <h1>Lion's Prowl</h1>
            <p>Uncover treasures with your tickets! Avoid lions to collect your winnings in RAWR tokens.</p>
          </header>

          <div class="stats-grid">
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-gift stat-icon" aria-hidden="true"></i>Current Prize</div>
              <div class="stat-value" id="current-prize">0.00</div>
            </article>
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-ticket-alt stat-icon" aria-hidden="true"></i>Tickets</div>
              <div class="stat-value" id="game-ticket-balance">50</div>
            </article>
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-trophy stat-icon" aria-hidden="true"></i>Current Multiplier</div>
              <div class="stat-value" id="current-multiplier">1x</div>
            </article>
          </div>

          <div class="game-board-container">
            <div class="game-grid-container prowl-board" id="gameGrid" role="group" aria-label="Savanna treasure grid"></div>
          </div>
          <p class="game-result" id="game-result" aria-live="polite">Choose your bet, then explore the savanna.</p>
        </section>

        <aside class="controls-column">
          <section class="controls-card glass-card">
            <label for="bet-amount" class="bet-label">Bet Amount (Tickets)</label>
            <div class="bet-input-container">
              <input type="number" id="bet-amount" value="10" min="1" max="1000" class="bet-input">
            </div>
            <div class="quick-bet-buttons" aria-label="Quick bet amount">
              <button type="button" class="quick-bet-btn" data-bet-value="1">1</button>
              <button type="button" class="quick-bet-btn active" data-bet-value="10">10</button>
              <button type="button" class="quick-bet-btn" data-bet-value="25">25</button>
              <button type="button" class="quick-bet-btn" data-bet-value="50">50</button>
              <button type="button" class="quick-bet-btn" data-bet-value="100">100</button>
              <button type="button" class="quick-bet-btn" data-bet-max>MAX</button>
            </div>
            <div class="action-buttons">
              <button type="button" class="action-btn collect-btn" id="cash-out" disabled><i class="fas fa-coins" aria-hidden="true"></i>Collect Winnings</button>
              <button type="button" class="action-btn new-game-btn" id="new-prowl"><i class="fas fa-play-circle" aria-hidden="true"></i>New Game</button>
            </div>
          </section>

          <section class="history-card glass-card">
            <h2 class="history-title">Game History</h2>
            <div class="history-items" id="game-history" aria-live="polite"></div>
          </section>
        </aside>
      </div>
      <p class="demo-disclaimer">Risk and payouts are simulated locally. No real betting or funds are used.</p>
    </main>
  </div>
  <div id="demo-notice" class="demo-notice" role="status"></div>
</body>
</html>

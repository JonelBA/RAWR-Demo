<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../../">
  <title>Safari Casino - Safari Roulette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/pages/multipage.css">
  <link rel="stylesheet" href="css/games/games.css">
  <link rel="stylesheet" href="css/php-pages/game-standalone.css">
  <link rel="stylesheet" href="css/php-pages/games/roulette.css">
  <link rel="stylesheet" href="css/php-pages/games/demo-interactions.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="demo-data/data.js" defer></script>
  <script src="js/pages/demo-state.js" defer></script>
  <script src="js/pages/site-shell.js" defer></script>
  <script src="js/pages/games.js" defer></script>
</head>
<body data-page="game-roulette" data-game="roulette">
  <div id="app-header"></div>
  <div class="app-layout">
    <aside id="app-sidebar"></aside>
    <main class="page-main standalone-game">
      <div class="game-grid">
        <section class="game-main-content">
          <header class="game-title-section">
            <h1>Safari Roulette</h1>
            <p>Bet with Tickets, win Tickets! Land on free spins or huge multipliers.</p>
          </header>

          <div class="stats-grid">
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-ticket-alt stat-icon" aria-hidden="true"></i>Ticket Balance</div>
              <div class="stat-value" id="game-ticket-balance">50</div>
            </article>
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-trophy stat-icon" aria-hidden="true"></i>Last Win</div>
              <div class="stat-value" id="last-win-display">0</div>
            </article>
            <article class="stat-card glass-card">
              <div class="stat-label"><i class="fas fa-sync-alt stat-icon" aria-hidden="true"></i>Free Spins</div>
              <div class="stat-value" id="free-spins-display">0</div>
            </article>
          </div>

          <div class="roulette-container" aria-label="Safari roulette wheel">
            <div class="roulette-border" aria-hidden="true"></div>
            <canvas id="rouletteCanvas" width="600" height="600" role="img" aria-label="Roulette wheel showing multipliers, free spins, and lose spaces"></canvas>
            <div class="roulette-pointer" aria-hidden="true"></div>
            <div class="roulette-center-hub" aria-hidden="true"></div>
          </div>
          <p class="game-result" id="game-result" aria-live="polite">Set your bet and spin the wheel.</p>
        </section>

        <aside class="controls-column">
          <section class="controls-card glass-card">
            <label for="bet-amount" class="bet-label">Bet Amount (Tickets)</label>
            <div class="bet-input-container">
              <input type="number" id="bet-amount" value="10" min="1" max="1000" class="bet-input">
            </div>
            <div class="quick-bet-buttons" aria-label="Quick bet amount">
              <button type="button" class="quick-bet-btn" data-bet-value="1">1</button>
              <button type="button" class="quick-bet-btn active" data-bet-value="10">10</button>
              <button type="button" class="quick-bet-btn" data-bet-value="25">25</button>
              <button type="button" class="quick-bet-btn" data-bet-value="50">50</button>
              <button type="button" class="quick-bet-btn" data-bet-value="100">100</button>
              <button type="button" class="quick-bet-btn" data-bet-max>MAX</button>
            </div>
            <div class="spin-buttons">
              <button type="button" class="spin-btn" id="spin-wheel">Spin</button>
              <button type="button" class="auto-spin-btn" id="auto-spin-wheel">Auto Spin</button>
            </div>
          </section>

          <section class="history-card glass-card">
            <h2 class="history-title">Spin History</h2>
            <div class="history-items" id="game-history" aria-live="polite"></div>
          </section>
        </aside>
      </div>
      <p class="demo-disclaimer">Wheel outcomes are simulated locally. No real funds or tokens are used.</p>
    </main>
  </div>
  <div id="demo-notice" class="demo-notice" role="status"></div>
</body>
</html>
